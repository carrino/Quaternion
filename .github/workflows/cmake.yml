name: Build and Test

on:
  push:
    branches: [ develop ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install Boost
      run: sudo apt-get update && sudo apt-get install -y libboost-test-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      # --no-tests=error makes an empty test list a failure instead of a pass.
      run: ctest -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
